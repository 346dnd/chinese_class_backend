server:
  host: "0.0.0.0"
  port: 8080
  upload_dir: "upload"   # 文件上传保存目录（相对工作目录）

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "123456"
  name: "zhonghuawenhua"
  ssl_mode: "disable"
  max_conns: 10

jwt:
  secret: "change-me-in-production"
  expire_hours: 24

ai:
  provider: "openai"          # openai / qwen / custom
  api_key: ""                  # LLM API 密钥（必填，建议通过环境变量 AI__API_KEY 设置）
  base_url: ""                 # 自定义端点（留空使用默认）
  model: "gpt-4o-mini"        # 模型名称

# 百度智能云 OCR 配置（用于 /api/utils/ocr 图片识别）
ocr:
  api_key: ""                  # 百度智能云 OCR API Key（建议通过环境变量 OCR__API_KEY 设置）
  secret_key: ""               # 百度智能云 OCR Secret Key（建议通过环境变量 OCR__SECRET_KEY 设置）

# 百度智能云语音合成 TTS 配置（用于 /api/utils/tts 文本转语音）
tts:
  api_key: ""                  # 百度智能云 TTS API Key（建议通过环境变量 TTS__API_KEY 设置）
  secret_key: ""               # 百度智能云 TTS Secret Key（建议通过环境变量 TTS__SECRET_KEY 设置）

# AI 提示词配置
# 提示词优先从 prompts.dir 目录加载（文件名不含扩展名作为 node_type key）
prompts:
  dir: "prompts"
  default: "你是一位中华文化教学助手，擅长以生动有趣的方式向中小学生讲解中国传统文化知识。回答要简洁、准确、适合学生理解。"

log:
  level: "info"
  encoding: "json"