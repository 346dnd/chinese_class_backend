root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main.exe ./cmd/server"
bin = "./tmp/main.exe"
full_bin = "./tmp/main.exe"
include_ext = ["go", "yaml"]
exclude_dir = ["vendor", "tmp"]
include_dir = []
delay = 500

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = false
